<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="t d">
  <title id="t">MacroPad layout</title>
  <desc id="d">The Adafruit MacroPad RP2040: an OLED and a rotary encoder above a grid of 12 keys in 4 rows of 3, shown with the Browser profile loaded.</desc>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; }
    .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .p { font-size: 13px; fill: #424a53; }
    .note { font-size: 12px; fill: #6e7781; }
    .oled { font-size: 11px; fill: #ffffff; }
    .cap { font-size: 13px; font-weight: 600; fill: #f0f3f6; text-anchor: middle; }
    .num { font-size: 9px; fill: #8c959f; }
    .lead { stroke: #8c959f; stroke-width: 1.5; fill: none; }
  </style>

  <!-- card background, readable in light and dark GitHub themes -->
  <rect x="0.5" y="0.5" width="759" height="519" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>

  <!-- pad body -->
  <rect x="40" y="40" width="330" height="440" rx="22" fill="#1f2328"/>

  <!-- OLED, 128x64 mono -->
  <rect x="60" y="60" width="204" height="102" rx="4" fill="#000000" stroke="#30363d"/>
  <g class="mono oled">
    <text x="70" y="79">Browser</text>
    <line x1="70" y1="85" x2="254" y2="85" stroke="#ffffff" stroke-width="0.6"/>
    <text x="70" y="101">Back</text><text x="134" y="101">Reload</text><text x="200" y="101">Fwd</text>
    <text x="70" y="116">NewTab</text><text x="134" y="116">Close</text><text x="200" y="116">Reopen</text>
    <text x="70" y="131">Addr</text><text x="134" y="131">Find</text><text x="200" y="131">Incog</text>
    <text x="70" y="146">Zoom-</text><text x="134" y="146">Zoom0</text><text x="200" y="146">Zoom+</text>
  </g>

  <!-- rotary encoder -->
  <circle cx="320" cy="112" r="34" fill="#2d333b" stroke="#57606a" stroke-width="2"/>
  <circle cx="320" cy="112" r="25" fill="#444c56"/>
  <line x1="320" y1="92" x2="320" y2="102" stroke="#d0d7de" stroke-width="3" stroke-linecap="round"/>

  <!-- 12 keys: LED color shown as the keycap glow -->
  <g class="sans">
    <!-- row 1 -->
    <rect x="62" y="190" width="82" height="56" rx="8" fill="#2d333b" stroke="#0080FF" stroke-width="3"/>
    <text class="cap" x="103" y="223">Back</text><text class="num" x="69" y="202">1</text>
    <rect x="164" y="190" width="82" height="56" rx="8" fill="#2d333b" stroke="#00C060" stroke-width="3"/>
    <text class="cap" x="205" y="223">Reload</text><text class="num" x="171" y="202">2</text>
    <rect x="266" y="190" width="82" height="56" rx="8" fill="#2d333b" stroke="#0080FF" stroke-width="3"/>
    <text class="cap" x="307" y="223">Fwd</text><text class="num" x="273" y="202">3</text>
    <!-- row 2 -->
    <rect x="62" y="261" width="82" height="56" rx="8" fill="#2d333b" stroke="#00C060" stroke-width="3"/>
    <text class="cap" x="103" y="294">NewTab</text><text class="num" x="69" y="273">4</text>
    <rect x="164" y="261" width="82" height="56" rx="8" fill="#2d333b" stroke="#FF0020" stroke-width="3"/>
    <text class="cap" x="205" y="294">Close</text><text class="num" x="171" y="273">5</text>
    <rect x="266" y="261" width="82" height="56" rx="8" fill="#2d333b" stroke="#FFA000" stroke-width="3"/>
    <text class="cap" x="307" y="294">Reopen</text><text class="num" x="273" y="273">6</text>
    <!-- row 3 -->
    <rect x="62" y="332" width="82" height="56" rx="8" fill="#2d333b" stroke="#A000FF" stroke-width="3"/>
    <text class="cap" x="103" y="365">Addr</text><text class="num" x="69" y="344">7</text>
    <rect x="164" y="332" width="82" height="56" rx="8" fill="#2d333b" stroke="#A000FF" stroke-width="3"/>
    <text class="cap" x="205" y="365">Find</text><text class="num" x="171" y="344">8</text>
    <rect x="266" y="332" width="82" height="56" rx="8" fill="#2d333b" stroke="#6e7681" stroke-width="3"/>
    <text class="cap" x="307" y="365">Incog</text><text class="num" x="273" y="344">9</text>
    <!-- row 4 -->
    <rect x="62" y="403" width="82" height="56" rx="8" fill="#2d333b" stroke="#FFD000" stroke-width="3"/>
    <text class="cap" x="103" y="436">Zoom-</text><text class="num" x="69" y="415">10</text>
    <rect x="164" y="403" width="82" height="56" rx="8" fill="#2d333b" stroke="#FFD000" stroke-width="3"/>
    <text class="cap" x="205" y="436">Zoom0</text><text class="num" x="171" y="415">11</text>
    <rect x="266" y="403" width="82" height="56" rx="8" fill="#2d333b" stroke="#FFD000" stroke-width="3"/>
    <text class="cap" x="307" y="436">Zoom+</text><text class="num" x="273" y="415">12</text>
  </g>

  <!-- callouts -->
  <path class="lead" d="M356 112 L404 92"/>
  <g class="sans">
    <text class="h" x="412" y="80">Rotary encoder</text>
    <text class="p" x="412" y="100">Turn: profile's knob action (volume, tabs…)</text>
    <text class="p" x="412" y="118">Press: Play/Pause by default</text>
    <text class="p" x="412" y="136">Hold + turn: profile picker, release to switch</text>
    <text class="p" x="412" y="154">Long press: reserved for future views</text>
  </g>

  <path class="lead" d="M264 150 L404 196"/>
  <g class="sans">
    <text class="h" x="412" y="200">OLED (128×64)</text>
    <text class="p" x="412" y="220">Profile name and the 12 key labels,</text>
    <text class="p" x="412" y="238">plus picker and volume overlays</text>
  </g>

  <path class="lead" d="M350 300 L404 296"/>
  <g class="sans">
    <text class="h" x="412" y="300">12 macro keys</text>
    <text class="p" x="412" y="320">One macro per key: shortcuts, held chords,</text>
    <text class="p" x="412" y="338">delays, typed text or media keys</text>
    <text class="p" x="412" y="356">Each LED shows its key's color;</text>
    <text class="p" x="412" y="374">held keys light up white</text>
  </g>

  <text class="sans note" x="412" y="452">Shown with the Browser profile loaded.</text>
  <text class="sans note" x="412" y="470">Each profile sets its own keys, colors and knob.</text>
</svg>
